[project]
authors = [{name = "Payman Tohidifar", email = "payman.tohidifar@gmail.com"}]
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "tiktoken>=0.7",
    "safetensors>=0.4",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "requests>=2.31",
    "wandb>=0.17",
]
name = "gpt2-classifier"
requires-python = ">= 3.11"
version = "0.1.0"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
gpt2_classifier = { path = ".", editable = true }

[tool.pixi.tasks]
test = "pytest"
lint = "ruff check ."

[tool.pixi.dependencies]
python = "3.11.*"

[tool.pixi.feature.dev.pypi-dependencies]
pytest = ">=8.0"
ruff = ">=0.6"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }

[tool.ruff]
line-length = 110
target-version = "py311"
