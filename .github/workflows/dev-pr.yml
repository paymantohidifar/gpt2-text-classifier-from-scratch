name: Open PR from dev to main

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Open PR to main if one isn't already open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing_pr=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')
          if [ -n "$existing_pr" ]; then
            echo "PR #$existing_pr already open from dev to main; nothing to do."
          else
            gh pr create \
              --base main \
              --head dev \
              --title "Updates from dev" \
              --body "Automated PR opened by CI on push to \`dev\`."
          fi
